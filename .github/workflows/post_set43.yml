name: Post Set 43 - Spring Cleaning Carousel

on:
  # schedule removed 2026-10-13: QA found slides 2 and 4 duplicate Set 12 (Jul 23), same unit. Held pending replacement.
  # schedule:
  #   - cron: '30 11 18 10 *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python post_carousel.py posts/set43
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SET_LABEL: "Set 43 (Spring Cleaning Carousel)"
