name: Post Set 28 - FAQ Carousel

on:
  # schedule switched off after this set posted: a day and month cron has no year, so it would fire again next year and
  # the already posted check only looks at the last 10 posts (set_status.py). Original lines kept below.
  # schedule:
  #   - cron: '30 11 30 8 *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python post_carousel.py posts/set28
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SET_LABEL: "Set 28 (FAQ Carousel)"
