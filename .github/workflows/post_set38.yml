name: Post Set 38 - Post Reno Move-In Carousel

on:
  # schedule trigger removed 2026-09-27 pending fixes, see caption_log/footage_catalogue
  # schedule:
  #   - cron: disabled
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python post_carousel.py posts/set38
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SET_LABEL: "Set 38 (Post Reno Move-In Carousel)"
